# Sandbox-only Jenkins controller — stands in for the office controller while
# we prove the runner + pipeline. NOT for the office.
#
# Connectivity model (H-6):
#   1. Local systemd agent on this host (jenkins-agent.service) connects directly
#      over host loopback (http://127.0.0.1:8080/ via Inbound WebSocket) — hence
#      127.0.0.1:8080 binding MUST be kept.
#   2. Operator browser on laptop connects via Tailscale (no SSH tunnel needed):
#      open http://100.80.3.14:8080
#   3. Remote agent on a separate host connects over Tailscale to 100.80.3.14:8080.
#
# Port 50000 is not published: the agent connects over WebSocket on 8080.
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: autore-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "100.80.3.14:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
